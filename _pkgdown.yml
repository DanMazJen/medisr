url: https://danmazjen.github.io/medisr/

home:
  title: medisr — Medical Statistics using R
  description: >
    A companion toolbox for the educational purpose of learning/teaching medical statistics using R.

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true

  bslib:
    primary: "#176B87"
    secondary: "#64B5C6"
    success: "#198754"
    info: "#3A86A8"
    warning: "#E9A23B"
    danger: "#C94C4C"

    bg: "#FFFFFF"
    fg: "#243746"

    border-radius: 0.65rem
    btn-border-radius: 0.4rem
    code-bg: "#F3F7F9"

  includes:
    in_header: |
      <meta name="theme-color" content="#176B87">

development:
  mode: auto

navbar:
  structure:
    left:
      - home
